name: Deploy to GitHub Pages

# Enabling Pages creates the `github-pages` environment, whose deployment
# branch policy only admits the repository's DEFAULT branch. A run from any
# other branch is rejected before it reaches a runner. So: listen on both
# branches we publish, but only actually deploy from whichever one is
# currently the default — this keeps working if the default is switched.
on:
  push:
    branches:
      - main
      - claude/jiu-hu-shi-long-website-8q8lxx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed by branch on purpose. Both published branches trigger a run, but only
# the default-branch one gets past the `if` below. A shared group would let the
# skipped run cancel the deploying one mid-flight (cancel-in-progress), which is
# exactly what happened on run #5.
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true is a no-op once Pages exists; it only helps on a repo
      # where the token is allowed to create the Pages site in the first place
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
